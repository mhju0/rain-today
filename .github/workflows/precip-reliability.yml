# Daily precipitation source-reliability transaction: restore the public
# reliability-state branch, run one cycle in isolation, validate the complete
# snapshot, and publish with compare-and-swap protection.
#
# IMPORTANT — the `schedule:` trigger only fires when this file is on the repo's
# default branch. Feature branches can still use workflow_dispatch.
name: precip-reliability

on:
  workflow_dispatch:
    inputs:
      recovery_ref:
        description: "Optional full 40-char known-good commit SHA or remote ref to union before this run"
        required: false
        type: string
  schedule:
    # 21:10 UTC ≈ 06:10 KST — after yesterday's KMA ASOS daily data is published.
    - cron: "10 21 * * *"

concurrency:
  group: precip-reliability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        # The transaction's Git adapter uses this persisted credential to publish.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run daily reliability transaction
        env:
          RECOVERY_REF: ${{ inputs.recovery_ref }}
          # All optional and server-side. Open-Meteo logs forecasts with no key;
          # other providers activate only when their secret is configured.
          MET_NO_USER_AGENT: ${{ secrets.MET_NO_USER_AGENT }}
          KMA_SHORT_TERM_API_KEY: ${{ secrets.KMA_SHORT_TERM_API_KEY }}
          PIRATE_WEATHER_API_KEY: ${{ secrets.PIRATE_WEATHER_API_KEY }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          KMA_OBSERVATION_API_KEY: ${{ secrets.KMA_OBSERVATION_API_KEY }}
          RELIABILITY_ETA: ${{ secrets.RELIABILITY_ETA }}
        run: |
          recovery_args=()
          if [ -n "${RECOVERY_REF:-}" ]; then
            recovery_args=(--recover "$RECOVERY_REF")
          fi
          npm run reliability:daily -- "${recovery_args[@]}"
