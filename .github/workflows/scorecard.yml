name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 0"
  push:
    branches:
      - main

permissions: read-all

jobs:
  analyze:
    name: OpenSSF Scorecard
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'branch_protection_rule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Analyze supply-chain security
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload findings to GitHub code scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
