version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    rebase-strategy: auto
    # Next.js 16.2 only supports TypeScript 7 through an experimental CLI path,
    # while eslint-config-next's TypeScript ESLint stack requires TypeScript <6.1.
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    rebase-strategy: auto
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
